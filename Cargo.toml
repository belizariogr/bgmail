[workspace]
resolver = "2"
members = [
    "crates/theme",
    "crates/ui",
    "crates/storage",
    "crates/rmail",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/belizario/bgmail"

[workspace.dependencies]
# UI framework (Zed's GPU-accelerated UI). Pinned to the published, standalone-buildable release.
gpui = "0.2.2"

# Serialization for persisted settings (window/column sizes) stored as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internal crates
theme = { path = "crates/theme" }
ui = { path = "crates/ui" }
storage = { path = "crates/storage" }

[profile.dev]
# Faster incremental builds while keeping the app responsive during development.
opt-level = 1

[profile.dev.package."*"]
# Dependencies (incl. gpui) are compiled with optimizations so the dev binary stays fast.
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
resolver = "2"
# Vendored third-party workspaces (own manifests, path-depended on by crates).
exclude = ["vendor/blitz", "vendor/taffy", "vendor/gpui"]
members = [
    "crates/theme",
    "crates/ui",
    "crates/storage",
    "crates/mail_core",
    "crates/protocols",
    "crates/mail_sync",
    "crates/html_view",
    "crates/bgmail",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/belizariogr/bgmail"

[workspace.dependencies]
# UI framework (Zed's GPU-accelerated UI). Pinned to the published, standalone-buildable release.
gpui = "0.2.2"

# Serialization for persisted settings (window/column sizes) stored as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internal crates
theme = { path = "crates/theme" }
ui = { path = "crates/ui" }
storage = { path = "crates/storage" }
mail_core = { path = "crates/mail_core" }
protocols = { path = "crates/protocols" }
mail_sync = { path = "crates/mail_sync" }
html_view = { path = "crates/html_view" }

[profile.dev]
# Faster incremental builds while keeping the app responsive during development.
opt-level = 1

[profile.dev.package."*"]
# Dependencies (incl. gpui) are compiled with optimizations so the dev binary stays fast.
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
# See vendor/serde_fmt/src/lib.rs: drops a foreign `From<_> for fmt::Error` impl
# that breaks Stylo (Blitz, used by crates/html_view) when built next to GPUI.
serde_fmt = { path = "vendor/serde_fmt" }
# See vendor/gpui: adds a per-window content scale, for the whole-app zoom.
gpui = { path = "vendor/gpui" }

[patch."https://github.com/DioxusLabs/taffy"]
# Blitz's pinned Taffy with BGMail layout fixes (vendor/taffy).
taffy = { path = "vendor/taffy" }

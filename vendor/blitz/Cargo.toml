# Vendored subset of DioxusLabs/blitz (rev e42ee1f, MIT OR Apache-2.0) used by
# crates/html_view, with BGMail layout fixes (see .dox/vendor/AGENTS.md).
# Kept as its own workspace (excluded from BGMail's) so the crates' `workspace =
# true` keys resolve against Blitz's dependency table below.
[workspace]
members = [
    "packages/debug_timer",
    "packages/blitz-traits",
    "packages/blitz-dom",
    "packages/blitz-html",
    "packages/stylo_taffy",
]
resolver = "2"

[workspace.package]
version = "0.3.0-beta.4"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/dioxuslabs/blitz"
repository = "https://github.com/dioxuslabs/blitz"
categories = ["gui"]
edition = "2024"
rust-version = "1.91.0"

[workspace.dependencies]
# Blitz dependencies(in-repo)
blitz = { version = "=0.3.0-beta.4", path = "./packages/blitz" }
blitz-dom = { version = "=0.3.0-beta.4", path = "./packages/blitz-dom", default-features = false }
blitz-html = { version = "=0.3.0-beta.4", path = "./packages/blitz-html", default-features = false }
blitz-net = { version = "=0.3.0-beta.4", path = "./packages/blitz-net", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", path = "./packages/blitz-paint", default-features = false }
blitz-vibey-script = { version = "=0.3.0-beta.4", path = "./packages/blitz-vibey-script", default-features = false }
blitz-shell = { version = "=0.3.0-beta.4", path = "./packages/blitz-shell", default-features = false }
blitz-traits = { version = "=0.3.0-beta.4", path = "./packages/blitz-traits", default-features = false }
stylo_taffy = { version = "=0.3.0-beta.4", path = "./packages/stylo_taffy", default-features = false }
dioxus-native = { version = "0.7.0", path = "./packages/dioxus-native", default-features = false }
dioxus-native-dom = { version = "0.7.0", path = "./packages/dioxus-native-dom", default-features = false }
debug_timer = { version = "0.1.2", path = "./packages/debug_timer" }
accesskit_xplat = { version = "0.2", path = "./packages/accesskit_xplat", default-features = false }
browser-persistence = { path = "./apps/browser/persistence" }
blitz-test-harness = { path = "./packages/blitz-test-harness" }

# Servo dependencies
# nicoburns/stylo: -webkit-text-fill-color (servo/stylo#504)
style = { version = "0.22.0", git = "https://github.com/nicoburns/stylo", rev = "78734bf554bb40af9dc11c0eedbe724f6055697c", package = "stylo" }
style_traits = { version = "0.22.0", git = "https://github.com/nicoburns/stylo", rev = "78734bf554bb40af9dc11c0eedbe724f6055697c", package = "stylo_traits" }
style_atoms = { version = "0.22.0", git = "https://github.com/nicoburns/stylo", rev = "78734bf554bb40af9dc11c0eedbe724f6055697c", package = "stylo_atoms" }
style_config = { version = "0.22.0", git = "https://github.com/nicoburns/stylo", rev = "78734bf554bb40af9dc11c0eedbe724f6055697c", package = "stylo_static_prefs" }
style_dom = { version = "0.22.0", git = "https://github.com/nicoburns/stylo", rev = "78734bf554bb40af9dc11c0eedbe724f6055697c", package = "stylo_dom" }
selectors = { version = "0.41.0", git = "https://github.com/nicoburns/stylo", rev = "78734bf554bb40af9dc11c0eedbe724f6055697c", package = "selectors" }
cssparser = { version = "0.38.0" }

# HTML5ever dependencies
markup5ever = "0.40.0" # needs to match stylo web_atoms version
html5ever = "0.40.1"   # needs to match stylo web_atoms version
xml5ever = "0.40.0"    # needs to match stylo web_atoms version

# Other Servo dependencies
euclid = "0.22"
atomic_refcell = "0.1.13"
app_units = "0.7.5"
smallvec = "1"
thin-vec = "0.2"

# DioxusLabs dependencies
dioxus = { version = "0.8.0-alpha.3" }
dioxus-core = { version = "0.8.0-alpha.3" }
dioxus-html = { version = "0.8.0-alpha.3" }
dioxus-hooks = { version = "0.8.0-alpha.3" }
dioxus-signals = { version = "0.8.0-alpha.3" }
dioxus-stores = { version = "0.8.0-alpha.3" }
dioxus-asset-resolver = { version = "0.8.0-alpha.3" }
manganis = { version = "0.8.0-alpha.3" }
dioxus-document = { version = "0.8.0-alpha.3" }
dioxus-history = { version = "0.8.0-alpha.3" }

# Dioxus hot reload
dioxus-devtools = { version = "0.8.0-alpha.3" }
dioxus-cli-config = { version = "0.8.0-alpha.3" }

# Dioxus Prelude
dioxus-core-macro = { version = "0.8.0-alpha.3" }

# Taffy + Parley + Fontations
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "c25605620351786eb6a742b74ea4d289f59ebd84", default-features = false, features = [
    "std",
    "flexbox",
    "flexbox_balance",
    "grid",
    "block_layout",
    "content_size",
    "calc",
    "detailed_layout_info",
] }
parley = { version = "0.12", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = [
    "std",
] } # Should match parley and vello versions

# AnyRender
anyrender = { version = "0.14.0" }
anyrender_serialize = { version = "0.8.0" }
anyrender_skia = { version = "0.12.0" }
anyrender_vello = { version = "0.15.0" }
anyrender_vello_cpu = { version = "0.18.0" }
anyrender_vello_hybrid = { version = "0.11.0" }
anyrender_svg = { version = "0.15.0" }
wgpu_context = { version = "0.10.0" }

# Linebender + Fontations + WGPU + SVG
color = "0.3"
linebender_resource_handle = "0.1"
peniko = "0.6.0"
kurbo = "0.13.1"
wgpu = "30"
usvg = "0.48.1"
svgtypes = "0.16.1" # Should match usvg's version

# Windowing & Input
raw-window-handle = "0.6.0"
winit = { version = "=0.31.0-beta.4" }
accesskit = "0.25"
rfd = { version = "0.17.1", default-features = false }
keyboard-types = "0.8"
cursor-icon = "1"

# IO & Networking
url = "2.5.0"
http = "1.1.0"
data-url = "0.3.1"
tokio = "1.42"
reqwest = { version = "0.13", default-features = false }
reqwest-middleware = { version = "0.5.1", default-features = false }
http-cache-reqwest = { version = "=1.0.0-alpha.6", default-features = false }
http-cache = { version = "=1.0.0-alpha.6", default-features = false }

# Media & Decoding
image = { version = "0.25.6", default-features = false }
wuff = "0.2"
html-escape = "0.2.13"
percent-encoding = "2.3.1"
png = "0.18"
serde = "1"

# Dioxus Native
webbrowser = "1.0"
directories = "6.0.0"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
tracing-wasm = "0.2.1"
web-sys = "0.3.98"
web-time = "1"
console_error_panic_hook = "0.1"

# JavaScript engine (Boa)
boa_engine = "0.22"
boa_runtime = "0.22"
boa_gc = "0.22"

# Other dependencies
rustc-hash = "2.1.2"
bytes = "1.7.1"
slotmap = "1.0.7"
tracing = "0.1.40"
tracing-subscriber = "0.3"
futures-util = "0.3.30"
futures-intrusive = "0.5.0"
pollster = "0.4"
smol_str = "0.3"
bitflags = "2.8.0"
bytemuck = "1"
rayon = "1"
test-that = "0.6.0"
thread_local = "1"

# Unicode (ICU4X)
icu_casemap = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "2.3", default-features = false }
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
writeable = { version = "0.6", default-features = false }


[patch."https://github.com/DioxusLabs/taffy"]
# Same patched Taffy BGMail builds against (vendor/taffy).
taffy = { path = "../taffy" }

# mail-parser 0.11.9 from crates.io, without its tests, examples and resources.
# BGMail: see .dox/vendor/AGENTS.md for what changed, each marked `BGMail`.
[package]
edition = "2024"
name = "mail-parser"
version = "0.11.9"
authors = ["Stalwart Labs <hello@stalw.art>"]
description = "Fast and robust e-mail parsing library for Rust"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/stalwartlabs/mail-parser"
autoexamples = false
autotests = false
autobenches = false

[workspace]

[features]
base64_slice = ["dep:memchr"]
default = []
full_encoding = ["encoding_rs"]
rkyv = ["dep:rkyv"]
serde = ["dep:serde"]

[lib]
name = "mail_parser"
path = "src/lib.rs"
doctest = false

[dependencies.encoding_rs]
version = "0.8"
optional = true

[dependencies.hashify]
version = "0.2"

[dependencies.memchr]
version = "2.7"
optional = true

[dependencies.rkyv]
version = "0.8"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[package]
name = "rmail"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "rMail"

# The binary is intentionally named "rMail" (mixed case): on macOS, when running
# unbundled (e.g. `cargo run`), the application menu title comes from the running
# process name, so this makes the global menu show "rMail" instead of "rmail".
[[bin]]
name = "rMail"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
theme.workspace = true
ui.workspace = true
storage.workspace = true
# Carries link-hover URLs from the webview's IPC callback (any thread) to the
# GPUI view, which drains them asynchronously to update the status bar.
async-channel = "2"

# Persisted settings (window/column sizes) serialized as JSON under
# ~/.config/rMail/config.json on every platform.
serde.workspace = true
serde_json.workspace = true

# Sanitizes e-mail HTML before it reaches the OS web engine: a real streaming
# parser (not regex) so malformed markup can't smuggle through the elements a
# reader must never render (scripts, frames, media, editable controls).
lol_html = "3.0.0"

# The embedded webview is only available where wry has a native backend we
# support (macOS/Windows). Other targets fall back to a plain-text reader.
# `open` launches links from message bodies in the user's default browser
# (per-platform, shell-injection-safe — important for untrusted e-mail URLs).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry.workspace = true
open = "5"

# macOS-only: GPUI 0.2 doesn't implement `start_window_move` on macOS, so we
# drag the window via AppKit's `performWindowDragWithEvent:` using the native
# window handle. Kept isolated in `window_drag.rs` behind a portable API.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"

# Windows-only: we disable DirectComposition (so WebView2 text composes), which
# makes GPUI's maximize-on-open asynchronous; the resize message that grows its
# viewport can be lost during the busy open sequence. We re-post `WM_SIZE` from
# the native handle so GPUI re-reads the real size. Kept isolated in
# `window_drag.rs`. `windows` matches the version GPUI already pulls in.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

# `objc` 0.2's `msg_send!` macro expands to a `feature = "cargo-clippy"` cfg that
# the compiler can't otherwise know about; declare it so the lint stays useful
# without flagging this harmless, dependency-generated case.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("cargo-clippy"))',
] }

[dev-dependencies]
tempfile = "3"

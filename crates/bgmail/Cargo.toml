[package]
name = "bgmail"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "BGMail"

# The binary is intentionally named "BGMail" (mixed case): on macOS, when running
# unbundled (e.g. `cargo run`), the application menu title comes from the running
# process name, so this makes the global menu show "BGMail" instead of "bgmail".
[[bin]]
name = "BGMail"
path = "src/main.rs"

[features]
# CEF windowless OSR for the HTML reader on every platform. Disable with:
# cargo run --no-default-features
default = ["cef-osr"]
cef-osr = ["dep:cef", "dep:open", "dep:image", "dep:smallvec", "dep:urlencoding"]
# Back-compat alias for the former Linux-only feature name.
linux-webview = ["cef-osr"]

[dependencies]
gpui.workspace = true
theme.workspace = true
ui.workspace = true
storage.workspace = true
# Carries link-hover URLs from the webview's IPC callback (any thread) to the
# GPUI view, which drains them asynchronously to update the status bar.
async-channel = "2"

# Persisted settings (window/column sizes) serialized as JSON under
# ~/.config/BGMail/config.json on every platform.
serde.workspace = true
serde_json.workspace = true

# Sanitizes e-mail HTML before it reaches the OS web engine: a real streaming
# parser (not regex) so malformed markup can't smuggle through the elements a
# reader must never render (scripts, frames, media, editable controls).
lol_html = "3.0.0"

# Chromium Embedded Framework — windowless OSR composited by GPUI. Optional so
# `--no-default-features` still builds without downloading the CEF runtime.
cef = { version = "=150.2.1", optional = true, default-features = false }
open = { version = "5", optional = true }
image = { version = "0.25", optional = true, default-features = false }
smallvec = { version = "1", optional = true }
urlencoding = { version = "2", optional = true }

# macOS-only: GPUI 0.2 doesn't implement `start_window_move` on macOS, so we
# drag the window via AppKit's `performWindowDragWithEvent:` using the native
# window handle. Kept isolated in `window_drag.rs` behind a portable API.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"

# Windows-only: maximize-on-open can drop `WM_SIZE` during the busy open sequence;
# we re-post it from the native handle. Kept isolated in `window_drag.rs`.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

# `objc` 0.2's `msg_send!` macro expands to a `feature = "cargo-clippy"` cfg that
# the compiler can't otherwise know about; declare it so the lint stays useful
# without flagging this harmless, dependency-generated case.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("cargo-clippy"))',
] }

[dev-dependencies]
tempfile = "3"

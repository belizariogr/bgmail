[package]
name = "bgmail"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A fast, simple and elegant desktop e-mail client."
default-run = "BGMail"

# The binary is intentionally named "BGMail" (mixed case): on macOS, when running
# unbundled (e.g. `cargo run`), the application menu title comes from the running
# process name, so this makes the global menu show "BGMail" instead of "bgmail".
[[bin]]
name = "BGMail"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
theme.workspace = true
ui.workspace = true
storage.workspace = true
# Mail domain, protocol clients and the background sync engine.
mail_core.workspace = true
protocols.workspace = true
mail_sync.workspace = true
# Message actions return storage's error type (same version as `storage`).
rusqlite = "0.37"
# Sync events are pushed from engine threads and awaited by a GPUI task.
async-channel = "2"
# Desktop notifications (D-Bus / macOS / WinRT behind one API).
notify-rust = "4.18"
# Local-time formatting of message dates (`clock` = local zone on every OS).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Native HTML mail rendering (Blitz layout painted by GPUI).
html_view.workspace = true

# Persisted settings (window/column sizes) serialized as JSON under
# ~/.config/BGMail/config.json on every platform.
serde.workspace = true
serde_json.workspace = true

# Sanitizes e-mail HTML before it reaches the renderer: a real streaming parser
# (not regex) so malformed markup can't smuggle through the elements a reader
# must never render (scripts, frames, media, editable controls).
lol_html = "3.0.0"
html-escape = "0.2"

# macOS-only: GPUI 0.2 doesn't implement `start_window_move` on macOS, so we
# drag the window via AppKit's `performWindowDragWithEvent:` using the native
# window handle. Kept isolated in `window_drag.rs` behind a portable API.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"
# LaunchServices strings: querying and setting the default mail app.
core-foundation = "0.10"

# Windows-only: maximize-on-open can drop `WM_SIZE` during the busy open sequence;
# we re-post it from the native handle. Kept isolated in `window_drag.rs`.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

# `objc` 0.2's `msg_send!` macro expands to a `feature = "cargo-clippy"` cfg that
# the compiler can't otherwise know about; declare it so the lint stays useful
# without flagging this harmless, dependency-generated case.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("cargo-clippy"))',
] }

[dev-dependencies]
tempfile = "3"
# The sanitizer's output is read back with the tokenizer `html_view`'s parser uses.
html5ever = "0.40"
# Simulated windows, to test what only happens with real input (drags).
gpui = { workspace = true, features = ["test-support"] }

# Windows: the app icon is compiled into the executable (Explorer, taskbar,
# Alt+Tab) by `build.rs`. GPUI already pulls `embed-resource` for its manifest.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Installable packages (`cargo packager --release`, see README "Install / Build
# packages" and `.github/workflows/release.yml`). Paths are relative to this
# crate; version, binary and description come from this manifest. Formats are
# the per-OS defaults (macOS app+dmg, Linux deb+appimage+pacman, Windows nsis);
# CI adds `--formats nsis,wix` on Windows.
[package.metadata.packager]
product-name = "BGMail"
identifier = "io.github.belizariogr.bgmail"
publisher = "Belizário Ribeiro"
authors = ["Belizário Ribeiro"]
copyright = "Copyright © 2026 Belizário Ribeiro"
homepage = "https://github.com/belizariogr/bgmail"
category = "Productivity"
long-description = """
BGMail is a native desktop e-mail client built on GPUI, the GPU-accelerated UI
framework from Zed. IMAP/SMTP and Gmail accounts, a macOS Mail-style layout,
light and dark themes, and a native, sanitized HTML reader."""
before-packaging-command = "cargo build --release -p bgmail --bin BGMail"
icons = [
    "../../assets/appIcon/BGMail-16.png",
    "../../assets/appIcon/BGMail-32.png",
    "../../assets/appIcon/BGMail-48.png",
    "../../assets/appIcon/BGMail-64.png",
    "../../assets/appIcon/BGMail-128.png",
    "../../assets/appIcon/BGMail-256.png",
    "../../assets/appIcon/BGMail-512.png",
    "../../assets/appIcon/BGMail.icns",
    "../../assets/appIcon/BGMail.ico",
]

# macOS only offers a bundle as mail app if it declares the scheme; on Linux the
# desktop template declares it (see below).
[[package.metadata.packager.deep-link-protocols]]
schemes = ["mailto"]
name = "E-mail"

[package.metadata.packager.macos]
# Same floor as Zed's bundle (GPUI's Metal renderer).
minimum-system-version = "10.15.7"

[package.metadata.packager.deb]
package-name = "bgmail"
section = "mail"
# Shared by deb, AppImage and pacman: Email categories, mailto handler and a
# StartupWMClass matching the GPUI `app_id` set in `main.rs`.
desktop-template = "packaging/linux/BGMail.desktop"
# Linked: xcb + xkbcommon. dlopen'ed by GPUI: wayland, Vulkan, fontconfig.
# Secrets use the Secret Service over D-Bus (pure Rust), no libdbus/libsecret.
depends = [
    "libc6",
    "libxcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libwayland-client0",
    "libwayland-cursor0",
    "libvulkan1",
    "mesa-vulkan-drivers | vulkan-icd",
    "libfontconfig1",
    # `xdg-mime`: querying and setting the default mail app.
    "xdg-utils",
]

[package.metadata.packager.pacman]
# The pkgname is derived from product-name (`bg-mail`); not configurable.
depends = [
    "libxcb",
    "libxkbcommon",
    "libxkbcommon-x11",
    "wayland",
    "vulkan-icd-loader",
    "fontconfig",
    "xdg-utils",
]

[package.metadata.packager.nsis]
installer-icon = "../../assets/appIcon/BGMail.ico"
# Per-user install (no UAC prompt); shortcuts get the AppUserModelID
# `identifier`, which toast notifications must use to show up as BGMail.
# BGMail keeps config + mail.db under ~/.config/BGMail on every OS; the
# uninstaller offers (unchecked) to remove it.
appdata-paths = ["$PROFILE/.config/BGMail"]

[package.metadata.packager.windows]
digest-algorithm = "sha256"
timestamp-url = "http://timestamp.digicert.com"
